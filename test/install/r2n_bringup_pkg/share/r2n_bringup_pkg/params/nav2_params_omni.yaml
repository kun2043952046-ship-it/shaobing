controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 30.0
    failure_tolerance: 0.3

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # ========= 运动模型 =========
      motion_model: "Omni"        # 关键：全向模型

      # ========= 速度限制 =========
      vx_max: 1.0
      vx_min: -0.5

      vy_max: 1.0
      vy_min: -1.0

      wz_max: 2.0
      wz_min: -2.0

      # ========= 加速度限制 =========
      ax_max: 3.0
      ax_min: -3.0

      ay_max: 3.0
      ay_min: -3.0

      az_max: 3.0

      # ========= 采样参数 =========
      batch_size: 2000
      time_steps: 15
      model_dt: 0.05

      # ========= 噪声标准差 =========
      vx_std: 0.4
      vy_std: 0.4
      wz_std: 0.4

      # ========= 温度参数 =========
      temperature: 0.3
      gamma: 0.015

      # ========= 轨迹裁剪 =========
      prune_distance: 1.7
      transform_tolerance: 0.2

      # ========= 可视化 =========
      visualize: true

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.5
      w_heuristic_cost: 1.1
      
      tolerance: 0.25
      allow_unknown: true

      max_iterations: 500000
      max_planning_time: 3.0


bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: body_2d

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: body_2d
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      always_send_full_costmap: true

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_topic: "/map"

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.1

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: camera_init
      robot_base_frame: body_2d
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 5.0
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.1
      always_send_full_costmap: True

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1e-10
      max_its: 1000
      do_refinement: true

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false