controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 30.0
    failure_tolerance: 0.3

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      publish_local_plan: true
      # ========= 运动模型 =========
      motion_model: "Omni"

      # ========= 速度限制 =========
      vx_max: 1.0
      vx_min: -0.5

      vy_max: 1.0
      vy_min: -1.0

      wz_max: 2.0
      wz_min: -2.0

      # ========= 加速度限制 =========
      ax_max: 3.0
      ax_min: -3.0

      ay_max: 3.0
      ay_min: -3.0

      az_max: 3.0

      # ========= 采样参数 =========
      batch_size: 2000
      time_steps: 15
      model_dt: 0.05

      # ========= 噪声 =========
      vx_std: 0.4
      vy_std: 0.4
      wz_std: 0.4

      # ========= 控制温度 =========
      temperature: 0.3
      gamma: 0.015

      prune_distance: 1.7
      transform_tolerance: 0.2

      visualize: true   # 调试阶段开，实车关

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"

      how_many_corners: 8

      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      w_heuristic_cost: 1.1

      tolerance: 0.2
      allow_unknown: true

      max_iterations: 500000
      max_planning_time: 3.0


bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      # ==== 机器人几何: 矩形 0.6m x 0.6m (前左/前右/后右/后左) ====
      footprint: "[[0.30, 0.30], [0.30, -0.30], [-0.30, -0.30], [-0.30, 0.30]]"
      footprint_padding: 0.02
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.05
      # 允许等 TF 的时间(s): 默认 0.1s 偏紧, /scan 的 body->body_2d 稍有延迟
      # 就会整帧被 MessageFilter 丢弃(日志 "Message Filter dropping message")
      transform_tolerance: 0.3
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      always_send_full_costmap: true

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_topic: "/map"

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.40

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: camera_init
      robot_base_frame: base_link
      # ==== 机器人几何: 矩形 0.6m x 0.6m (与 global 保持一致) ====
      footprint: "[[0.30, 0.30], [0.30, -0.30], [-0.30, -0.30], [-0.30, 0.30]]"
      footprint_padding: 0.02
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # 允许等 TF 的时间(s): 同 global_costmap, 避免 /scan 整帧被丢
      transform_tolerance: 0.3
      update_frequency: 10.0
      publish_frequency: 5.0
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.40
      always_send_full_costmap: True

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1e-10
      max_its: 1000
      do_refinement: true

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 30.0
    scale_velocities: false
    feedback: "OPEN_LOOP"

    max_velocity: [1.0, 1.0, 2.0]
    min_velocity: [-0.5, -1.0, -2.0]

    max_accel: [3.0, 3.0, 3.0]
    max_decel: [-3.0, -3.0, -3.0]

    deadband_velocity: [0.0, 0.0, 0.0]