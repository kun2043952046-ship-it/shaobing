# Nav2 参数 (ROS 2 Humble), 由 realtime_pgm.launch.py 传给 nav2_bringup/navigation_launch.py
#
# 与本包其他节点的配合关系:
#   - scripts/nav2_bridge.py 发布 /map (实时占据栅格, transient_local) 与
#     TF: map->odom(静态恒等) / odom->base_link(来自 /Odometry + lidar_to_base 外参)
#   - 定位由 FAST-LIO /Odometry 提供, 因此不启动 AMCL / map_server
#   - global_costmap 的 static_layer 订阅 /map 实时刷新, obstacle_layer 直接吃
#     /cloud_registered 注册点云做增量障碍; local_costmap 为滚动窗口
#   - 默认行为树 (navigate_to_pose_w_replanning_true) 会以 1Hz 周期重规划,
#     配合实时代价地图即可实现动态避障
#
# 可调项 (与车体相关的默认值):
#   - robot_radius 0.50: 硬性最小间距 (车体旋转轴中心 -> 障碍), 与自建 A* 的
#     astar_inflate_radius 统一口径 (均为"车体中心 -> 障碍")。
#     占点(hold_point)模式的碰撞/拦截安全间距复用该值。
#   - inflation_radius 0.60: 软性避让范围 (障碍影响半径), 与自建 A* 的
#     astar_cost_reach 统一。0.50~0.60 m 为"可通行但高代价"的软化安全圈。
#   - cost_scaling_factor 3.0: 膨胀代价衰减曲线 (保持原有调参)
#   - desired_linear_vel 0.5: RPP 最大线速度, 按底盘能力调整

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /Odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    # 【必需】行为树节点插件库列表。
    # Nav2 Humble 的 bt_navigator 不会自动发现插件: BT XML 里的每个节点
    # (ComputePathToPose / FollowPath / RateController / RecoveryNode /
    #  ClearEntireCostmap / Spin / Wait / BackUp / PlannerSelector /
    #  ControllerSelector 等) 都必须先在 plugin_lib_names 里注册对应的
    # 插件库, 否则加载 BT 时报 "plugin not found / Node not recognized",
    # 动作服务器随之拒绝目标 -> planner_server 永不发布 /plan。
    # 现象与"点击网页后一直没生成路径"完全一致, 且 /plan 上虽有 Publisher
    # 注册却一条消息都没有。
    # 下面这份列表与 Nav2 Humble 官方 nav2_params.yaml 保持一致。
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node
    # 自定义行为树: 重规划周期由默认 1.0 Hz 提到 5.0 Hz (200 ms/次)。
    # Nav2 自带默认 BT 里 RateController 的 hz 写死为 1.0, 参数文件改不动,
    # 只能整棵 BT 换掉。文件 config/navigate_to_pose_w_replanning_5hz.xml
    # 由 CMakeLists 随 config/ 目录一起安装到本包 share 下。
    #
    # 【路径语义 + 为什么这里写"包名/相对路径"也能用】
    # Nav2 Humble 打开这个值时只有两条路:
    #   (a) 直接按该字符串当文件路径打开 (绝对路径, 或相对"进程工作目录"的路径);
    #   (b) 打不开时退回 nav2_bt_navigator 包的 behavior_trees/ 目录里找。
    # 它【不会】去 ament 索引里按 "包名/相对路径" 解析, 所以单靠本 yaml 里写的
    # "test_draw_pgm_realtime/config/xxx.xml" 是打不开的, 会报
    #   "Couldn't open input XML file: test_draw_pgm_realtime/config/xxx.xml"
    # -> bt_navigator 激活失败 -> NavigateToPose 动作服务器不可用 ->
    # planner_server 永不被调用 -> 网页点击目标后一条 /plan 都没有。
    # 真正的兜底在 realtime_pgm.launch.py: 它用 nav2_common 的 RewrittenYaml 把
    # 下面两个参数在 launch 阶段改写成"本包 config/ 下的绝对路径"后再传给 Nav2
    # (既保证能打开, 又不必在 yaml 里硬编码 /home/<user>/... 这样的机器相关路径)。
    # 也就是说: 只有通过 realtime_pgm.launch.py 启动时才保证有效;
    # 若手工 `ros2 launch nav2_bringup navigation_launch.py params_file:=本文件`,
    # 请自行把下面两行换成绝对路径。
    default_nav_to_pose_bt_xml: "test_draw_pgm_realtime/config/navigate_to_pose_w_replanning_5hz.xml"
    default_nav_through_poses_bt_xml: "test_draw_pgm_realtime/config/navigate_to_pose_w_replanning_5hz.xml"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /Odometry
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    # 【本工程必须放宽, 否则导航会被误判中止 -> 路线不再更新】
    # 真正驱动底盘的是 test_draw_pgm_realtime 下发的 CAN 运动帧; Nav2 的
    # controller 只是"旁观者": 它算出的 /cmd_vel 不作用于车体, 但它仍用
    # SimpleProgressChecker 判断"10 s 内必须移动 0.5 m"。于是只要出现下列任一
    # 情况, 就会被判失败:
    #   - 调试期下位机断电/未使能 (车、但方向盘不动)
    #   - 原地等待避障/重规划 (合法停顿)
    #   - 车体由另一路驱动, 与 controller 期望不一致
    # 后果是一条链式故障:
    #   [ERROR] controller_server: Failed to make progress
    #   [WARN]  [follow_path] [ActionServer] Aborting handle.
    #   -> FollowPath 中止 -> 行为树重试耗尽 -> 整条 NavigateToPose 中止
    #   -> planner_server 不再被调用 -> /plan 冻结在最后一次结果
    #   -> 跟随器只能按过期路径跑 (障碍早已移动, 旧路径不再安全)
    # 放宽后: 行为树保持活跃, 以 5 Hz 持续重规划, /plan 与 /local_plan 持续刷新,
    # 跟随器每 10 ms 重读最新路径 => "运动过程中路线时时更新 + 绕开新障碍"。
    # 到点仍由 goal_checker (xy 0.25 m) 与跟随器自身 (motion_goal_tolerance) 判定;
    # "卡死/导航已结束"由跟随器的 motion_plan_timeout 监督与网页停止按钮兜底。
    # 想恢复 Nav2 自带的卡死保护: 把下面两行改回 0.5 / 10.0 即可。
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 3600.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # Regulated Pure Pursuit: 差速底盘 + 动态避障减速
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.5
      lookahead_dist: 0.8
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.2
      lookahead_time: 1.0
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 2.5
      max_robot_pose_search_dist: 10.0
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      # 提速: 窗口仅 4x4 m (80x80 格), 20 Hz 更新+发布开销可忽略。
      # 这是"红色代价区域实时跟随绿色障碍"的关键一环: costmap 取绿点云的最新
      # 频率越高, 红区滞后越小 (20 Hz = 50 ms 取一次, 相比 10 Hz 再快一倍)。
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # 注意: width/height 在 nav2_costmap_2d 里声明为整型, 必须写整数,
      # 写成 4.0 会报 "parameter {height} is of type {integer},
      # setting it to {double} is not allowed" 并使 controller_server 崩溃
      width: 4
      height: 4
      resolution: 0.05
      # 硬性最小间距 0.50 m (车体旋转轴中心 -> 障碍): 与自建 A* 的
      # astar_inflate_radius 统一口径 (Nav2 的 robot_radius 语义 = 机器人足迹中心
      # 到障碍的致命距离, 即"路径中心线不得比它更靠近障碍")。
      # 占点(hold_point)模式的碰撞/拦截安全间距也复用该值。
      robot_radius: 0.50
      transform_tolerance: 0.3
      plugins: [obstacle_layer, inflation_layer]
      # 只保留 dynamic_obstacles 一条源: pointcloud (/cloud_self_filtered) 源已
      # 移除。原因是该源不做 z 向筛选(见 nav2_params 之外的 C++ 自过滤只管 XY
      # 方框), 而 obstacle_layer 的高度带是 -0.5~1.0 m, 比 PGM 历史图的
      # -2.25~0.22 m 高一截, 于是 z∈(0.22,1.0] 的高位点(桌面下沿/椅面/货架
      # 层板/车体自身高处结构)在网页图里看不见, 却会被 marking 成致命障碍,
      # 形成车周一团持续刷新的红色区域。
      # 移除后: 静态墙避障由 static_layer 吃实时 /map 负责; 动态障碍由
      # dynamic_obstacles 负责(它的基准图与 PGM 共用同一 z 带, 天生不受污染)。
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: pointcloud dynamic_obstacles clear_ring
        pointcloud:
          # 【只清除, 不标记】—— 本源的唯一职责是"提供覆盖全 360° 的清除射线",
          # 绝不标记障碍 (marking:false), 因此不会重演"z∈(0.22,1.0] 高位点被标成
          # 致命障碍"的红团问题。这是上一步删掉它之后清除能力大降的补偿:
          # Nav2 的 raytrace 是"对每个点从传感器原点连线清除", 射线方向取决于
          # 点云本身的方向分布 —— dynamic_obstacles 源在障碍消失后就没有点了,
          # "那个方向"的旧红格没有任何射线可清; 而本源的完整帧点云 (上万点) 覆盖
          # 整个视野, 是唯一能给全场发清除射线的源。
          # 配合 raytrace_max_range=10 贯穿 4x4 m 局部窗口, 旧红格才能清干净。
          topic: /cloud_self_filtered
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -0.5
          max_obstacle_height: 1.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
        dynamic_obstacles:
          # 临时/可变障碍: 源点云只含"当前帧新出现的临时障碍", 语义上是
          # "当前可见即存在, 不可见即不存在", 因此对这条源开启 clearing :
          # obstacle_layer 是累积式栅格, 只 marking 的话障碍离开后旧格不会消失,
          # 会永远保留成 cost 100 (网页上的红色区域)。开 clearing 后由 raytrace
          # 把射线穿过的格子置为空闲, 红色区域才会随障碍消失。
          topic: /cloud_dynamic_obstacles
          data_type: PointCloud2
          marking: true
          clearing: true
          # 高度带不在 Nav2 侧过滤: 节点端按建图同一高度带 (zmin/zmax, 默认
          # [-2.25, 0.22]) 过滤后才发到本话题, 这里放宽到 [-10, 10], 避免二次
          # 过滤悄悄丢点 (曾因 [-0.5, 1.0] 把 z<-0.5 的障碍点全部滤掉
          # -> 绿色有、红色无)。
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          # marking 与 clearing 是两套独立范围:
          #   obstacle_max_range  只决定"多远内的返回点被标记成障碍";
          #   raytrace_max_range  只决定"清除射线射多远"(在此处截断)。
          # 关键: raytrace_max_range 必须 > obstacle_max_range, 否则射线一打到
          # 障碍就停住, 障碍"背后"的旧红格永远清不到。
          # 窗口 4x4 m (对角线 2.83 m) 远小于 10 m, 故射线可贯穿整个窗口。
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
        clear_ring:
          # 纯清除射线源 (只 clearing, marking 必须 false):
          #   点云是 test_draw_pgm_realtime 每帧发来的一圈 base_link 系稀疏点
          #   (半径 clear_ring_radius, 默认 1.2 m)。obstacle_layer 会从车体原点
          #   向每个点连线, 射线穿过的旧红格被清成空闲 —— 这是"红色代价区域
          #   跟随绿色障碍消失"的主要清除手段:
          #   dynamic_obstacles 源只有在障碍仍可见时才有射线, 障碍一消失就没有
          #   任何点经过旧红格, 单靠它清不动, 红区会残留。
          #   marking 必须 false: 否则这圈点会被标成障碍, 车周立刻烧出一圈红环。
          topic: /cloud_clear_ring
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -0.5
          max_obstacle_height: 1.0
          # 本源只做清除, obstacle_max_range 其实不参与 (marking=false),
          # 但保持与其它源一致以免误配。
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        # 软性避让范围 0.60 m (与自建 A* 的 astar_cost_reach 统一):
        # 0.50~0.60 m 为"可通行但高代价"区, 规划器倾向避开; >0.60 m 代价归零。
        inflation_radius: 0.60
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      # 提速: 障碍层不必等到 1 Hz 才生效, 减少"点到目标时地图还是旧的"等待。
      # 提到 10 Hz 让全局代价地图的红区也实时跟随绿色障碍的出现/消失
      # (全局图比局部图大得多, 不宜像 local 那样拉到 20 Hz)。
      # publish_frequency 与 update_frequency 对齐 (publish > update 无意义)
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_link
      # 硬性最小间距 0.50 m (车体旋转轴中心 -> 障碍), 与自建 A* 口径统一
      robot_radius: 0.50
      resolution: 0.05
      track_unknown_space: false
      transform_tolerance: 0.3
      plugins: [static_layer, obstacle_layer, inflation_layer]
      # static_layer 订阅 nav2_bridge.py 的实时 /map, 会随地图尺寸自动 resize
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      # 同 local_costmap: 已移除 pointcloud (/cloud_self_filtered) 源, 只留
      # dynamic_obstacles + clear_ring, 避免 z∈(0.22,1.0] 高位点被 marking 成
      # 致命障碍。
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: pointcloud dynamic_obstacles clear_ring
        pointcloud:
          # 同 local_costmap: 只清除不标记, 提供覆盖全 360° 的清除射线。
          # 全局图覆盖 ±20 m 整张地图, 故 raytrace_max_range 给到 30 m, 让射线
          # 能一路清掉远处"绕车跑一圈"留下的历史红色轨迹。
          topic: /cloud_self_filtered
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -0.5
          max_obstacle_height: 1.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
        dynamic_obstacles:
          # 临时/可变障碍 (网页"锁定历史累计图"后由 test_draw_pgm_realtime
          # 发布): 已从静态历史图里剔除, 不会永久烧进地图, 但仍在此 marking
          # 参与全局重规划。未锁定时该话题无数据, 等价于未启用。
          # 开启 clearing 的原因同 local_costmap: 全局代价地图同样是累积式,
          # 只 marking 会让障碍离开后红色(cost 100)区域永久残留。
          topic: /cloud_dynamic_obstacles
          data_type: PointCloud2
          marking: true
          clearing: true
          # 同 local_costmap: 高度带由节点端按建图同一高度带 (zmin/zmax) 过滤,
          # 这里放宽到全量程, 避免二次过滤丢点。
          # 本话题点云与网页绿色层同源 (当帧整帧点云), 并额外并入锁定的静态
          # 基准障碍 —— 保证不会撞上累计历史图里的冻结障碍。
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          # 同 local_costmap: marking / clearing 是两套独立范围。
          # 全局图覆盖 ±20 m 的整张地图, 清除射线必须能一路射出去, 否则
          # raytrace_max_range 之外的旧红格永远不会被清 (这正是之前残留的根因)。
          # 取地图对角线量级 (40 m 地图对角线 ≈ 56 m), 这里给 30 m 已足以
          # 清掉绝大多数历史红色轨迹; 再大也只是徒增射线步进开销。
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
        clear_ring:
          # 纯清除射线源 (只 clearing, marking=false), 原因同 local_costmap:
          # 让绿色障碍消失后的旧红格被实时清成空闲, 避免红区残留。
          topic: /cloud_clear_ring
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -0.5
          max_obstacle_height: 1.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        # 软性避让范围 0.60 m (与自建 A* 的 astar_cost_reach 统一)
        inflation_radius: 0.60
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    # 与自定义 BT 的 RateController hz=5.0 对齐: 该值只用于"实际频率低于它时
    # 打一条 WARN", 不改变实际调用频率。设 1.0 会在 5 Hz 重规划下不再告警,
    # 设 5.0 便于观察 planner 是否跟得上 (跟不上会持续 WARN)。
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    # NavFn 显式配置: 不依赖 nav2 内置默认值, 行为可见/可调/升级后不会静默变化
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      # A*(启发式牵引) 替代 Dijkstra(均匀波前扩散):
      # 800x800 栅格上点到点搜索展开量通常少 2~5 倍, 且最优性不变
      use_astar: true
      # 未观测区域按可通行处理(代价 +1); 实时建图中地图边界外全是未知,
      # 置 false 会导致边界附近的目标直接判定"无解"
      allow_unknown: true
      # 目标落点容差: 点偏到膨胀层/占据格时, 允许在 0.5 m 内就近找可通行格,
      # 设太小(如 0.1)容易出现 "Failed to create a plan" 而看不到路径
      tolerance: 0.5

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [SimpleSmoother]
    SimpleSmoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: /local_costmap/costmap_raw
    local_footprint_topic: /local_costmap/published_footprint
    global_costmap_topic: /global_costmap/costmap_raw
    global_footprint_topic: /global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: CLOSED_LOOP
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.5]
    max_decel: [-1.0, 0.0, -2.5]
    odom_topic: /Odometry
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
